name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Prepare visual QA fonts
        run: |
          curl -fL --retry 3 \
            -o /tmp/Inter.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf'
          MATERIAL_ICONS_PATH="$(find "$FLUTTER_ROOT" -name MaterialIcons-Regular.otf | head -n 1)"
          test -n "$MATERIAL_ICONS_PATH"
          echo "VISUAL_QA_MATERIAL_ICONS_PATH=$MATERIAL_ICONS_PATH" >> "$GITHUB_ENV"
      - name: Run visual QA
        env:
          VISUAL_QA_FONT_PATH: /tmp/Inter.ttf
        run: flutter test tool/visual_qa_test.dart --reporter expanded
      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: build/visual_qa
          if-no-files-found: error

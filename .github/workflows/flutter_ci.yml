name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Prepare visual QA fonts
        run: |
          curl -fL --retry 3 \
            -o /tmp/Inter.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf'
          MATERIAL_ICONS_PATH="$(find "$FLUTTER_ROOT" -name MaterialIcons-Regular.otf | head -n 1)"
          test -n "$MATERIAL_ICONS_PATH"
          echo "VISUAL_QA_MATERIAL_ICONS_PATH=$MATERIAL_ICONS_PATH" >> "$GITHUB_ENV"
      - name: Run visual QA
        env:
          VISUAL_QA_FONT_PATH: /tmp/Inter.ttf
        run: flutter test tool/visual_qa_test.dart --reporter expanded
      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: build/visual_qa
          if-no-files-found: error

      - name: Refresh portfolio screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p screenshots
          cp build/visual_qa/runtime/02_3-1853.png screenshots/onboarding.png
          cp build/visual_qa/runtime/05_3-1932.png screenshots/sign_up.png
          cp build/visual_qa/runtime/22_3-2922.png screenshots/home_dashboard.png
          cp build/visual_qa/runtime/25_3-3287.png screenshots/account_details.png
          cp build/visual_qa/runtime/46_3-5618.png screenshots/budgets.png
          cp build/visual_qa/runtime/48_3-6026.png screenshots/insights.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then
            echo "Portfolio screenshots are already current."
            exit 0
          fi
          git commit -m "docs: refresh portfolio screenshots [skip ci]"
          git push

name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Prepare visual QA fonts
        run: |
          curl -fL --retry 3 \
            -o /tmp/Inter.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf'
          MATERIAL_ICONS_PATH="$(find "$FLUTTER_ROOT" -name MaterialIcons-Regular.otf | head -n 1)"
          test -n "$MATERIAL_ICONS_PATH"
          echo "VISUAL_QA_MATERIAL_ICONS_PATH=$MATERIAL_ICONS_PATH" >> "$GITHUB_ENV"

      - name: Run visual QA
        env:
          VISUAL_QA_FONT_PATH: /tmp/Inter.ttf
        run: flutter test tool/visual_qa_test.dart --reporter expanded

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: build/visual_qa
          if-no-files-found: error

      - name: Build Android demo APK
        run: flutter build apk --release --no-pub

      - name: Upload Android demo APK
        uses: actions/upload-artifact@v4
        with:
          name: brees-android-demo
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Refresh portfolio assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p screenshots docs/downloads

          cp build/visual_qa/runtime/02_3-1853.png screenshots/onboarding.png
          cp build/visual_qa/runtime/05_3-1932.png screenshots/sign_up.png
          cp build/visual_qa/runtime/22_3-2922.png screenshots/home_dashboard.png
          cp build/visual_qa/runtime/25_3-3287.png screenshots/account_details.png
          cp build/visual_qa/runtime/46_3-5618.png screenshots/budgets.png
          cp build/visual_qa/runtime/48_3-6026.png screenshots/insights.png

          cp build/app/outputs/flutter-apk/app-release.apk docs/downloads/brees-demo.apk
          sha256sum docs/downloads/brees-demo.apk > docs/downloads/brees-demo.apk.sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots docs/downloads

          if git diff --cached --quiet; then
            echo "Portfolio assets are already current."
            exit 0
          fi

          git commit -m "chore: refresh portfolio assets [skip ci]"
          git push

      - name: Delete safely merged branches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              per_page: 100,
            });

            for (const pull of pulls) {
              if (!pull.merged_at) continue;
              if (pull.head.repo?.full_name !== `${owner}/${repo}`) continue;

              const branch = pull.head.ref;
              if (!branch || branch === context.payload.repository.default_branch) continue;

              try {
                const current = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });

                if (current.data.object.sha !== pull.head.sha) {
                  core.info(`Skipping ${branch}: branch advanced after merge.`);
                  continue;
                }

                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted merged branch ${branch}.`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`${branch} is already deleted.`);
                  continue;
                }
                throw error;
              }

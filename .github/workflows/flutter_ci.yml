name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Prepare visual QA fonts
        run: |
          curl -fL --retry 3 \
            -o /tmp/Inter.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf'
          MATERIAL_ICONS_PATH="$(find "$FLUTTER_ROOT" -name MaterialIcons-Regular.otf | head -n 1)"
          test -n "$MATERIAL_ICONS_PATH"
          echo "VISUAL_QA_MATERIAL_ICONS_PATH=$MATERIAL_ICONS_PATH" >> "$GITHUB_ENV"

      - name: Generate Brees brand assets
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/generate_brand_assets.py --font /tmp/Inter.ttf

      - name: Run visual QA
        env:
          VISUAL_QA_FONT_PATH: /tmp/Inter.ttf
        run: flutter test tool/visual_qa_test.dart --reporter expanded

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: build/visual_qa
          if-no-files-found: error

      - name: Build Android demo APK
        run: flutter build apk --release --no-pub

      - name: Upload Android demo APK
        uses: actions/upload-artifact@v4
        with:
          name: brees-android-demo
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Refresh portfolio assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p screenshots docs/downloads downloads

          cp build/visual_qa/runtime/02_3-1853.png screenshots/onboarding.png
          cp build/visual_qa/runtime/05_3-1932.png screenshots/sign_up.png
          cp build/visual_qa/runtime/22_3-2922.png screenshots/home_dashboard.png
          cp build/visual_qa/runtime/25_3-3287.png screenshots/account_details.png
          cp build/visual_qa/runtime/46_3-5618.png screenshots/budgets.png
          cp build/visual_qa/runtime/48_3-6026.png screenshots/insights.png

          cp build/app/outputs/flutter-apk/app-release.apk docs/downloads/brees-demo.apk
          sha256sum docs/downloads/brees-demo.apk > docs/downloads/brees-demo.apk.sha256

          cp build/app/outputs/flutter-apk/app-release.apk downloads/brees-demo.apk
          sha256sum downloads/brees-demo.apk > downloads/brees-demo.apk.sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            screenshots \
            docs/downloads \
            downloads \
            docs/assets/brees-logo.png \
            docs/assets/brees-wordmark.png \
            docs/assets/brees-app-icon.png \
            android/app/src/main/res/drawable/ic_launcher_brees.png \
            ios/Runner/Assets.xcassets/AppIcon.appiconset/Brees-AppIcon-1024.png \
            macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_*.png \
            web/favicon.png \
            web/icons/Icon-*.png \
            web/icons/Icon-maskable-*.png

          if git diff --cached --quiet; then
            echo "Portfolio assets are already current."
            exit 0
          fi

          git commit -m "chore: refresh portfolio assets [skip ci]"
          git push

      - name: Delete safely merged branches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null and .head.repo.full_name == env.GITHUB_REPOSITORY) | [.head.ref, .head.sha] | @tsv' |
          while IFS=$'\t' read -r branch merged_sha; do
            if [[ -z "${branch:-}" || "$branch" == "main" ]]; then
              continue
            fi

            current_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ -z "$current_sha" ]]; then
              echo "$branch is already deleted."
              continue
            fi

            if [[ "$current_sha" != "$merged_sha" ]]; then
              echo "Skipping $branch: branch advanced after merge."
              continue
            fi

            git push origin --delete "$branch"
            echo "Deleted merged branch $branch."
          done
